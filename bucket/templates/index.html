<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bucket</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="bucket">
<meta property="og:title" content="bucket">
<meta property="og:description" content="a tiny ephemeral file drop">
<meta property="og:url" content="https://bucket.hellyhome.nl/">
<meta property="og:image" content="https://bucket.hellyhome.nl/static/og-image.png">
<meta name="twitter:card" content="summary">
<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --border: #e6e4df;
    --text: #262523;
    --muted: #8a877f;
    --accent: #3f6e63;
    --accent-weak: #eaf1ef;
    --danger: #a4453a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
  }
  .ttl-note {
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 2px;
  }

  #addBtn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--accent);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.12s, border-color 0.12s;
  }
  #addBtn:hover { background: var(--accent-weak); border-color: var(--accent); }
  #fileInput { display: none; }

  /* --- modal --- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(38, 37, 35, 0.35);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 14px;
    padding: 22px;
    width: 100%;
    max-width: 300px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.14);
  }
  .modal-title {
    font-size: 14.5px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .pw-wrap {
    position: relative;
    margin-bottom: 10px;
  }
  .modal input {
    width: 100%;
    padding: 10px 52px 10px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
  }
  .pw-toggle {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    padding: 0 12px;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }
  .pw-toggle:hover { color: var(--text); }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 13.5px;
    cursor: pointer;
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #modalError {
    color: var(--danger);
    font-size: 12.5px;
    margin: -4px 0 10px;
    display: none;
  }

  /* --- sections / grid --- */
  .section { margin-bottom: 26px; }
  .section-title {
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 18px 12px;
  }
  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    text-decoration: none;
    color: inherit;
    position: relative;
    cursor: pointer;
  }
  .icon {
    width: 64px;
    height: 76px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon::before {
    content: "";
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 14px 14px 0;
    border-color: transparent var(--bg) transparent transparent;
    opacity: 0.6;
  }
  .icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .icon .ext {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 3px 6px;
    border-radius: 4px;
  }
  .t-pdf .ext   { background: #f6e2df; color: #a4453a; }
  .t-doc .ext   { background: #e1eaf3; color: #3b5f82; }
  .t-sheet .ext { background: #e2ede7; color: #3f6e63; }
  .t-slide .ext { background: #f4e3ea; color: #a13d63; }
  .t-zip .ext   { background: #f1ebdd; color: #8a6d3b; }
  .t-text .ext  { background: #ececea; color: #6b6b66; }
  .t-generic .ext { background: #ececea; color: #8a877f; }

  .name {
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.3;
    max-height: 2.6em;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }
  .size {
    margin-top: 2px;
    font-size: 11px;
    color: var(--muted);
  }

  .del {
    display: none;
    position: absolute;
    top: -6px;
    right: 10px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: 12px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 1;
  }
  body.unlocked .del { display: flex; }
  .del:hover { color: var(--danger); border-color: var(--danger); }

  #empty {
    color: var(--muted);
    font-size: 13.5px;
    text-align: center;
    padding: 60px 0;
  }

  .footer-actions {
    display: none;
    justify-content: center;
    gap: 18px;
    margin-top: 28px;
  }
  body.unlocked .footer-actions { display: flex; }
  .footer-actions button {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    padding: 0;
  }
  #clearBtn:hover { color: var(--danger); }
  #lockBtn:hover { color: var(--text); }

  #dropHint {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(63, 110, 99, 0.08);
    border: 2px dashed var(--accent);
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 15px;
    z-index: 15;
    pointer-events: none;
  }
  #dropHint.show { display: flex; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>bucket</h1>
      <div class="ttl-note">files disappear after ~{{ ttl_hours|int }}h</div>
    </div>
    <button id="addBtn" type="button" title="Add files" aria-label="Add files">+</button>
    <input id="fileInput" type="file" multiple>
  </header>

  <div id="sections"></div>
  <div id="empty" style="display:none">nothing here right now</div>

  <div class="footer-actions">
    <button id="lockBtn" type="button">lock</button>
    <button id="clearBtn" type="button">clear all</button>
  </div>
</div>

<div id="dropHint">drop to upload</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title">Enter password</div>
    <div class="pw-wrap">
      <input id="modalPw" type="password" autocomplete="current-password">
      <button class="pw-toggle" id="pwToggle" type="button" aria-label="Show password">show</button>
    </div>
    <div id="modalError">wrong password</div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel" type="button">Cancel</button>
      <button class="btn primary" id="modalSubmit" type="button">Unlock</button>
    </div>
  </div>
</div>

<script>
const sectionsEl = document.getElementById('sections');
const emptyEl = document.getElementById('empty');
const addBtn = document.getElementById('addBtn');
const fileInput = document.getElementById('fileInput');
const lockBtn = document.getElementById('lockBtn');
const clearBtn = document.getElementById('clearBtn');
const modalOverlay = document.getElementById('modalOverlay');
const modalPw = document.getElementById('modalPw');
const modalError = document.getElementById('modalError');
const modalSubmit = document.getElementById('modalSubmit');
const modalCancel = document.getElementById('modalCancel');
const dropHint = document.getElementById('dropHint');
const pwToggle = document.getElementById('pwToggle');

let unlocked = false;
let openPickerAfterUnlock = false;

const TYPES = {
  pdf: 't-pdf', doc: 't-doc', docx: 't-doc', rtf: 't-doc',
  xls: 't-sheet', xlsx: 't-sheet', csv: 't-sheet', numbers: 't-sheet',
  ppt: 't-slide', pptx: 't-slide', key: 't-slide',
  zip: 't-zip', rar: 't-zip', '7z': 't-zip', tar: 't-zip', gz: 't-zip',
  txt: 't-text', md: 't-text',
};
const IMAGE_EXTS = new Set(['png','jpg','jpeg','gif','webp','svg','heic','bmp']);

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function extOf(filename) {
  const i = filename.lastIndexOf('.');
  return i === -1 ? '' : filename.slice(i + 1).toLowerCase();
}

function iconFor(filename) {
  const ext = extOf(filename);
  if (IMAGE_EXTS.has(ext)) return { image: true };
  const cls = TYPES[ext] || 't-generic';
  const label = ext ? ext.slice(0, 4).toUpperCase() : 'FILE';
  return { image: false, cls, label };
}

function hoursGroup(expiresAt) {
  const secsLeft = expiresAt - Date.now() / 1000;
  const hours = Math.max(1, Math.ceil(secsLeft / 3600));
  return hours;
}

function tileHtml(f) {
  const icon = iconFor(f.filename);
  const url = `/f/${f.slug}/${encodeURIComponent(f.filename)}`;
  const iconInner = icon.image
    ? `<img src="${url}" alt="">`
    : `<span class="ext">${icon.label}</span>`;
  const iconClass = icon.image ? '' : icon.cls;
  return `
    <a class="tile" href="${url}">
      <div class="icon ${iconClass}">${iconInner}</div>
      <div class="name">${f.filename}</div>
      <div class="size">${fmtSize(f.size)}</div>
      <button class="del" title="delete" data-slug="${f.slug}" type="button">✕</button>
    </a>
  `;
}

function render(files) {
  sectionsEl.innerHTML = '';
  emptyEl.style.display = files.length ? 'none' : 'block';

  const groups = new Map();
  for (const f of files) {
    const h = hoursGroup(f.expires_at);
    if (!groups.has(h)) groups.set(h, []);
    groups.get(h).push(f);
  }
  const hours = [...groups.keys()].sort((a, b) => b - a);

  for (const h of hours) {
    const section = document.createElement('div');
    section.className = 'section';
    const label = h <= 1 ? '< 1h left' : `${h}h left`;
    section.innerHTML = `<div class="section-title">${label}</div><div class="grid"></div>`;
    const grid = section.querySelector('.grid');
    for (const f of groups.get(h)) {
      grid.insertAdjacentHTML('beforeend', tileHtml(f));
    }
    sectionsEl.appendChild(section);
  }

  sectionsEl.querySelectorAll('.del').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      deleteFile(btn.dataset.slug);
    });
  });
}

function setUnlocked(v) {
  unlocked = v;
  document.body.classList.toggle('unlocked', v);
}

async function refresh() {
  const res = await fetch('/api/files');
  const data = await res.json();
  setUnlocked(data.unlocked);
  render(data.files);
}

function openModal() {
  modalError.style.display = 'none';
  modalPw.value = '';
  modalPw.type = 'password';
  pwToggle.textContent = 'show';
  modalOverlay.classList.add('show');
  modalPw.focus();
}
function closeModal() {
  modalOverlay.classList.remove('show');
}

pwToggle.addEventListener('click', () => {
  const showing = modalPw.type === 'text';
  modalPw.type = showing ? 'password' : 'text';
  pwToggle.textContent = showing ? 'show' : 'hide';
  modalPw.focus();
});

addBtn.addEventListener('click', () => {
  if (unlocked) {
    fileInput.click();
  } else {
    openPickerAfterUnlock = true;
    openModal();
  }
});
modalCancel.addEventListener('click', () => { openPickerAfterUnlock = false; closeModal(); });
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

async function doUnlock() {
  modalError.style.display = 'none';
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: modalPw.value }),
  });
  if (res.ok) {
    closeModal();
    setUnlocked(true);
    await refresh();
    if (openPickerAfterUnlock) {
      openPickerAfterUnlock = false;
      fileInput.click();
    }
  } else {
    modalError.style.display = 'block';
  }
}
modalSubmit.addEventListener('click', doUnlock);
modalPw.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doUnlock();
  if (e.key === 'Escape') closeModal();
});

lockBtn.addEventListener('click', () => {
  fetch('/api/logout', { method: 'POST' }).then(refresh);
});

async function deleteFile(slug) {
  await fetch('/api/files/' + slug, { method: 'DELETE' });
  refresh();
}

clearBtn.addEventListener('click', async () => {
  if (!confirm('Delete everything in the bucket?')) return;
  await fetch('/api/clear', { method: 'POST' });
  refresh();
});

async function uploadFiles(fileList) {
  if (!fileList.length) return;
  const form = new FormData();
  for (const f of fileList) form.append('file', f);
  await fetch('/api/upload', { method: 'POST', body: form });
  refresh();
}

fileInput.addEventListener('change', () => uploadFiles(fileInput.files));

let dragDepth = 0;
window.addEventListener('dragenter', (e) => {
  if (!unlocked) return;
  dragDepth++;
  dropHint.classList.add('show');
});
window.addEventListener('dragleave', () => {
  if (!unlocked) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) dropHint.classList.remove('show');
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0;
  dropHint.classList.remove('show');
  if (!unlocked) return;
  uploadFiles(e.dataTransfer.files);
});

refresh();
setInterval(refresh, 20000);
</script>
</body>
</html>
