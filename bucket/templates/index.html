<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bucket</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --border: #e6e4df;
    --text: #262523;
    --muted: #8a877f;
    --accent: #3f6e63;
    --accent-weak: #eaf1ef;
    --danger: #a4453a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
  }
  .ttl-note {
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 2px;
  }
  #lockBtn {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    padding: 4px 6px;
  }
  #lockBtn:hover { color: var(--text); }

  #loginBox {
    display: none;
    gap: 8px;
    margin-bottom: 20px;
  }
  #loginBox.show { display: flex; }
  #loginBox input {
    flex: 1;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--card);
    color: var(--text);
  }
  #loginBox button, .btn {
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 13.5px;
    cursor: pointer;
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #loginError {
    color: var(--danger);
    font-size: 12.5px;
    margin: -12px 0 16px;
    display: none;
  }

  #dropzone {
    display: none;
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 22px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    margin-bottom: 22px;
    cursor: pointer;
  }
  #dropzone.show { display: block; }
  #dropzone.drag { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); }
  #fileInput { display: none; }

  #list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .row .name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13.5px;
  }
  .row .meta {
    color: var(--muted);
    font-size: 12px;
    flex-shrink: 0;
  }
  .row a.dl {
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    flex-shrink: 0;
  }
  .row button.del {
    display: none;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  body.unlocked .row button.del { display: inline-block; }
  .row button.del:hover { color: var(--danger); }

  #empty {
    color: var(--muted);
    font-size: 13.5px;
    text-align: center;
    padding: 40px 0;
  }

  #clearBtn {
    display: none;
    margin-top: 20px;
    color: var(--muted);
    background: none;
    border: none;
    font-size: 12.5px;
    cursor: pointer;
    padding: 0;
  }
  body.unlocked #clearBtn { display: inline-block; }
  #clearBtn:hover { color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>bucket</h1>
      <div class="ttl-note">files disappear after ~{{ ttl_hours|int }}h</div>
    </div>
    <button id="lockBtn" type="button">unlock</button>
  </header>

  <div id="loginBox">
    <input id="pw" type="password" placeholder="password" autocomplete="current-password">
    <button class="btn primary" id="loginSubmit" type="button">go</button>
  </div>
  <div id="loginError">wrong password</div>

  <div id="dropzone">
    drop files here, or tap to choose
    <input id="fileInput" type="file" multiple>
  </div>

  <div id="list"></div>
  <div id="empty" style="display:none">nothing here right now</div>

  <button id="clearBtn" type="button">clear all</button>
</div>

<script>
const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const lockBtn = document.getElementById('lockBtn');
const loginBox = document.getElementById('loginBox');
const loginError = document.getElementById('loginError');
const pwInput = document.getElementById('pw');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const clearBtn = document.getElementById('clearBtn');

let unlocked = false;

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function fmtRemaining(expiresAt) {
  const secs = expiresAt - Date.now() / 1000;
  if (secs <= 0) return 'expiring…';
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  if (h > 0) return `${h}h ${m}m left`;
  return `${m}m left`;
}

function render(files) {
  listEl.innerHTML = '';
  emptyEl.style.display = files.length ? 'none' : 'block';
  for (const f of files) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span class="name">${f.filename}</span>
      <span class="meta">${fmtSize(f.size)} · ${fmtRemaining(f.expires_at)}</span>
      <a class="dl" href="/f/${f.slug}/${encodeURIComponent(f.filename)}">download</a>
      <button class="del" title="delete" data-slug="${f.slug}">✕</button>
    `;
    row.querySelector('.del').addEventListener('click', () => deleteFile(f.slug));
    listEl.appendChild(row);
  }
}

function setUnlocked(v) {
  unlocked = v;
  document.body.classList.toggle('unlocked', v);
  dropzone.classList.toggle('show', v);
  lockBtn.textContent = v ? 'lock' : 'unlock';
}

async function refresh() {
  const res = await fetch('/api/files');
  const data = await res.json();
  setUnlocked(data.unlocked);
  render(data.files);
}

lockBtn.addEventListener('click', () => {
  if (unlocked) {
    fetch('/api/logout', { method: 'POST' }).then(refresh);
  } else {
    loginBox.classList.toggle('show');
    pwInput.focus();
  }
});

async function doLogin() {
  loginError.style.display = 'none';
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pwInput.value }),
  });
  if (res.ok) {
    pwInput.value = '';
    loginBox.classList.remove('show');
    refresh();
  } else {
    loginError.style.display = 'block';
  }
}
document.getElementById('loginSubmit').addEventListener('click', doLogin);
pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

async function deleteFile(slug) {
  await fetch('/api/files/' + slug, { method: 'DELETE' });
  refresh();
}

clearBtn.addEventListener('click', async () => {
  if (!confirm('Delete everything in the bucket?')) return;
  await fetch('/api/clear', { method: 'POST' });
  refresh();
});

async function uploadFiles(fileList) {
  if (!fileList.length) return;
  const form = new FormData();
  for (const f of fileList) form.append('file', f);
  await fetch('/api/upload', { method: 'POST', body: form });
  refresh();
}

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => uploadFiles(fileInput.files));
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  uploadFiles(e.dataTransfer.files);
});

refresh();
setInterval(refresh, 20000);
</script>
</body>
</html>
